<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1024px;height:500px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff;
 background:radial-gradient(circle at 82% 30%,#ff7a1a55 0,#0000 45%),linear-gradient(135deg,#14161b 0%,#0b0c0f 100%);position:relative}
.road{position:absolute;right:-60px;bottom:-140px;width:620px;height:420px;border-radius:50%;border:3px dashed #ffffff22;transform:rotate(-12deg)}
.road2{position:absolute;right:-120px;bottom:-210px;width:760px;height:520px;border-radius:50%;border:2px solid #ff8a0033;transform:rotate(-12deg)}
.left{position:absolute;left:64px;top:70px;width:560px}
.logo{display:flex;align-items:center;gap:18px}
.logo img{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 30px #ff6d0055}
h1{font-size:58px;font-weight:800;letter-spacing:-1px;line-height:1}
h1 span{color:#ff8a00}
.tag{margin-top:26px;font-size:30px;font-weight:700;line-height:1.25}
.tag em{font-style:normal;color:#ff9a2e}
.chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:16px;font-weight:500;padding:8px 16px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff26}
.chip.sos{background:#e5393533;border-color:#e5393599}
.bike{position:absolute;right:70px;top:110px;width:330px;height:330px;border-radius:50%;
 background:linear-gradient(135deg,#ff9800,#e64a19);display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px #ff6d0044}
.ring{position:absolute;border-radius:50%;border:2px solid #ff8a0044}
</style></head><body>
<div class="road2"></div><div class="road"></div>
<div class="ring" style="right:40px;top:80px;width:390px;height:390px"></div>
<div class="ring" style="right:10px;top:50px;width:450px;height:450px;border-color:#ff8a0022"></div>
<div class="bike"><svg viewBox="0 0 108 108" width="250" height="250">
 <circle cx="54" cy="45" r="3" fill="#fff"/>
 <path d="M48.34,39.34 A8,8 0 0,1 59.66,39.34" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"/>
 <path d="M44.10,35.10 A14,14 0 0,1 63.90,35.10" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none"/>
 <g transform="translate(28.8 41.5) scale(2.1)"><path fill="#fff" d="M20 11c-.18 0-.36.03-.53.05L17.41 9H20V6l-3.72 1.86L13.41 5H9v2h3.59l2 2H11l-4 2-2-2H0v2h4c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4l2 2h3l3.49-6.1 1.01 1.01c-.91.73-1.5 1.84-1.5 3.09 0 2.21 1.79 4 4 4s4-1.79 4-4-1.79-4-4-4zM4 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm16 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></g></svg></div>
<div class="left">
 <div class="logo"><img src="../graphics/play-icon-512.png"><h1>Bikers<span>Thrill</span></h1></div>
 <div class="tag">Ride together.<br><em>Stay connected.</em></div>
 <div class="chips"><div class="chip">📍 Live group tracking</div><div class="chip sos">🚨 One-tap SOS</div>
 <div class="chip">💥 Crash detection</div><div class="chip">✅ Verified riders</div></div>
</div></body></html>
