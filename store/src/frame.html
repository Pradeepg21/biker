<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:100vw;height:100vh;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(circle at 85% 8%,#ff8a0066 0,#0000 38%),radial-gradient(circle at 10% 95%,#e64a1944 0,#0000 40%),linear-gradient(160deg,#17191f,#0b0c0f)}
.cap{padding:6vh 7vw 0;text-align:center}
h1{font-size:5.6vw;font-weight:800;line-height:1.12;letter-spacing:-.02em}
h1 em{font-style:normal;color:#ff9a2e}
p{margin-top:1.4vh;font-size:2.9vw;font-weight:600;color:#ffffffb3}
.dev{margin-top:4vh;border-radius:3.2vw;overflow:hidden;box-shadow:0 2vh 6vh #000a,0 0 0 .7vw #2a2d34;flex:none}
.dev img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="cap"><h1 id="t"></h1><p id="s"></p></div>
<div class="dev" id="d"><img id="i"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('t').innerHTML=q.get('t');document.getElementById('s').textContent=q.get('s')||'';
const W=innerWidth,H=innerHeight,ar=+q.get('ar');           // ar = device height / width
const h=H*(+q.get('dh')||0.70), w=h/ar;
const d=document.getElementById('d');d.style.width=w+'px';d.style.height=h+'px';
document.getElementById('i').src=q.get('i');
</script></body></html>
